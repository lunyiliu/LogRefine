[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logrefine"
version = "1.0.0"
description = "Four-role agentic refinement of system logs into instruction data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["requests>=2.25"]

[project.scripts]
logrefine = "lr.cli:main"

[tool.setuptools]
packages = ["lr"]

[tool.setuptools.package-data]
lr = ["prompts/v1/*.md", "prompts/v1/*.json"]
